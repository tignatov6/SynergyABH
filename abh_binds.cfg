// ABH binds - чистый HL2 ABH, без стрейф-буста
// Положить в: synergy/cfg/abh_binds.cfg
// Запуск в консоли игры: exec abh_binds

// Прыжок на колесо - так проще попадать в кадр приземления
bind "MWHEELUP" "+jump"
bind "MWHEELDOWN" "+jump"

// Показ скорости (слева вверху). При рабочем ABH скорость
// растет каждый прыжок примерно по формуле: новая = старая*2 - лимит
// (в присяде лимит ~209, каждый прыжок дает все больше)
cl_showpos 1

// ВАЖНО: sv_airaccelerate, sv_gravity, sv_maxspeed НЕ трогаем -
// чистый ABH работает на ванильных значениях Synergy/HL2.
// echo для подтверждения загрузки
echo "ABH binds loaded: wheel=jump, cl_showpos=1"
